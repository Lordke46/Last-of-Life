name: Veri güncelle

# Günde dört kez maç/fixture/oran/haber günceller; uzun tarihsel backfill yapmaz.
# Hızlı iş dakika 17'de biter; bu iş dakika 47'dedir. 05:47 UTC, Türkiye
# sabah kuponundan (06:20 UTC) önce biter.
on:
  schedule:
    - cron: "47 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      news:
        description: "Haberleri de çek"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Üretim veritabanı bağlantısını doğrula
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::DATABASE_URL secret tanımlı değil; yerel SQLite'a yazmak yerine durduruldu"
            exit 1
          fi
      - run: pip install -r requirements.txt
      - name: İleri şema uyumluluğu
        run: python scripts/ensure_schema.py
        env:
          REQUIRE_POSTGRES: "1"
      - name: Güncelle
        timeout-minutes: 40
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m app.updater ${{ github.event_name == 'workflow_dispatch' && !inputs.news && '--no-news' || '' }}
      - name: Araştırma kuyruğu (ayrıca etkinleştirilirse)
        if: ${{ vars.RESEARCH_AUTO_ENABLED == '1' }}
        env:
          RESEARCH_AUTO_ENABLED: '1'
          RESEARCH_AUTO_OWNER: ${{ vars.RESEARCH_AUTO_OWNER }}
          RESEARCH_DATABASE_URL: ${{ secrets.RESEARCH_QUEUE_DATABASE_URL }}
        run: python -m app.research_auto
      - name: Veri bütünlüğü denetimi
        if: ${{ always() && env.DATABASE_URL != '' }}
        timeout-minutes: 2
        run: python -m app.data_quality --strict
      - name: Model karnesini yenile
        timeout-minutes: 10
        continue-on-error: true
        run: python -m app.model.report
