name: Sağlık kontrolü

# API erişimini ve veritabanı bağlantısını doğrular. Veri eskimesi ayrı
# güncelleme işlerinin sorumluluğundadır; sağlık kontrolü yeni job tetiklemez.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API ve veritabanı sağlığı
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            -H "Cache-Control: no-cache" \
            -o health.json https://lastoflife.vercel.app/api/health
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("health.json").read_text())
          if not data.get("db"):
              raise SystemExit("API erişilebilir ama veritabanı sağlıklı değil")
          if not data.get("ok"):
              print("::warning::Veri tazeliği sorunu: " + ", ".join(data.get("problems", [])))
          else:
              print("API ve veritabanı sağlıklı")
          PY
