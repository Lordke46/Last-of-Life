name: Backtest worker
# Boş kuyrukta 15 dakikada bir runner açılmaz. Saatlik kontrol yeter;
# asıl hesap kuyrukta iş varsa bu koşuda yapılır.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      audit_export:
        description: "Yalnız herkese açık maç/tahmin verilerini salt okunur dışa aktar"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: backtest-worker
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - if: ${{ !inputs.audit_export }}
        run: python scripts/ensure_schema.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: ${{ !inputs.audit_export }}
        run: python -m app.backtest_jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Salt okunur model denetimi
        if: ${{ inputs.audit_export }}
        run: python scripts/export_model_audit.py --output output/model-audit.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.audit_export }}
        with:
          name: model-audit
          path: output/model-audit.json
          retention-days: 3
          if-no-files-found: error
