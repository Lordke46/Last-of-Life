name: Backtest worker
# Boş kuyrukta 15 dakikada bir runner açılmaz. Saatlik kontrol yeter;
# asıl hesap kuyrukta iş varsa bu koşuda yapılır.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backtest-worker
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/ensure_schema.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m app.backtest_jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
